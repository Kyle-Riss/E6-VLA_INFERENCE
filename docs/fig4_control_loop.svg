<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540"
     font-family="Helvetica, Arial, 'Liberation Sans', sans-serif">
  <!-- End-to-end control loop (paper figure) — E6 VLA.  16:9, 960x540.

       TEXT-ONLY REFINEMENT (2026-08-28). Every rect, line, marker, colour and dashed group
       is byte-identical to the previous revision; only <text> content and font sizes changed,
       plus the canvas height 456 -> 540 to reach 16:9 WITHOUT moving any shape.

       TYPE SCALE at 180 mm print width (1 px = 0.5315 pt):
         group title   20 px = 10.6 pt  bold
         box title     17 px =  9.0 pt  bold
         spec line     15 px =  8.0 pt  regular
         arrow / note  13 px =  6.9 pt  regular
       No box holds more than three lines. No sentence-final periods.
       Symbols are unified: multiplication sign U+00D7, capital delta U+0394, pi U+03C0.

       ONE DEVIATION from the brief, forced by the freeze on geometry: the Action Expert box
       is 54 px tall, which holds a 17 px title plus ONE 15 px spec line. The requested third
       line would need about 14 px more height. "Gemma 300M . LoRA" and "conditional flow
       matching" were merged into one line and the word "conditional" moved to the caption.
       Growing only that box by 14 px would restore the third line.

       Verified on branch mpc+ :
         action is joint delta, deg per frame, NOT end effector pose
             e6_vla.launch.py:45  action_mode="delta"
             executor_supervisor_node.py:730  target_deg = a[:6]
             executor_supervisor_node.py:447  MovJ(j1..j6, 1)  mode 1 is joint space
         joint state never reaches the model
             pi0.py:125-128, :182-184 built only for the non flow matching variant
             config.py:1567 (v16), :1660 (v17) leave the discrete state input off
         no IK solver on the host; the E6 controller resolves kinematics on board
             grep over ros2/src/e6_vla_ros/ and src/openpi/ gives 0 hits
             git log -S'moveit' over all branches gives 0 commits
         URDF supplies joint position limits only
             executor_supervisor_node.py:86-92  _load_joint_limits_deg()
             executor_supervisor_node.py:762    np.clip(target_deg, min, max)
         62.5 ms tick and the :29999 command socket: docs/STAGE1_PAPER_EVIDENCE.md A-1, A-2 -->
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1a5fb4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="960" height="540" fill="#ffffff"/>

  <!-- ================= inputs ================= -->
  <rect x="24" y="30" width="124" height="54" rx="4" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="86" y="56" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">HIK camera</text>
  <text x="86" y="76" text-anchor="middle" font-size="13" fill="#111">224×224 RGB</text>

  <rect x="162" y="30" width="124" height="54" rx="4" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="224" y="56" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">ZED camera</text>
  <text x="224" y="76" text-anchor="middle" font-size="13" fill="#111">224×224 RGB</text>

  <rect x="300" y="30" width="124" height="54" rx="4" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="362" y="56" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Phase prompt</text>
  <text x="362" y="76" text-anchor="middle" font-size="13" fill="#111">natural language</text>

  <!-- collector bus -->
  <line x1="86"  y1="84" x2="86"  y2="112" stroke="#111" stroke-width="1.6"/>
  <line x1="224" y1="84" x2="224" y2="112" stroke="#111" stroke-width="1.6"/>
  <line x1="362" y1="84" x2="362" y2="112" stroke="#111" stroke-width="1.6"/>
  <line x1="86"  y1="112" x2="362" y2="112" stroke="#111" stroke-width="1.6"/>
  <line x1="224" y1="112" x2="224" y2="136" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="438" y="116" font-size="15" fill="#111">2 Hz observation</text>

  <!-- ================= policy server ================= -->
  <rect x="24" y="136" width="400" height="210" rx="8"
        fill="#f5f6f8" stroke="#555" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="224" y="163" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">π0 Policy Server</text>

  <rect x="42" y="172" width="364" height="82" rx="4" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="224" y="200" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Vision–Language Backbone</text>
  <text x="224" y="226" text-anchor="middle" font-size="15" fill="#111">SigLIP So400m/14 + Gemma 2B</text>
  <text x="224" y="248" text-anchor="middle" font-size="15" fill="#111">frozen backbone · Vision LoRA</text>

  <line x1="224" y1="254" x2="224" y2="276" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="236" y="270" font-size="13" fill="#111">prefix</text>

  <rect x="42" y="276" width="364" height="54" rx="4" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="224" y="300" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Action Expert</text>
  <text x="224" y="321" text-anchor="middle" font-size="15" fill="#111">Gemma 300M · LoRA · flow matching</text>

  <!-- ================= action chunk crossing the process boundary ================= -->
  <line x1="424" y1="241" x2="536" y2="241" stroke="#1a5fb4" stroke-width="2.2" marker-end="url(#ab)"/>
  <text x="480" y="222" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5fb4">16 × 7 chunk</text>
  <text x="480" y="262" text-anchor="middle" font-size="13" fill="#1a5fb4">Δq + gripper</text>
  <text x="480" y="284" text-anchor="middle" font-size="13" fill="#1a5fb4">2 Hz WebSocket</text>

  <!-- ================= execution layer ================= -->
  <rect x="536" y="136" width="400" height="210" rx="8"
        fill="#f5f6f8" stroke="#555" stroke-width="1.4" stroke-dasharray="7 4"/>
  <text x="736" y="163" text-anchor="middle" font-size="20" font-weight="bold" fill="#111">ROS 2 Execution</text>

  <rect x="554" y="172" width="364" height="158" rx="4" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="736" y="204" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Joint-Space Safety Layer</text>
  <text x="736" y="240" text-anchor="middle" font-size="15" fill="#111">Δq integration · 3°/frame clamp</text>
  <text x="736" y="268" text-anchor="middle" font-size="15" fill="#111">joint limits · height/vacuum guards</text>
  <text x="736" y="302" text-anchor="middle" font-size="15" font-weight="bold" fill="#1a5fb4">62.5 ms control tick</text>

  <line x1="736" y1="346" x2="736" y2="372" stroke="#111" stroke-width="1.6" marker-end="url(#a)"/>

  <rect x="536" y="372" width="400" height="50" rx="4" fill="#ffffff" stroke="#111" stroke-width="1.6"/>
  <text x="736" y="394" text-anchor="middle" font-size="17" font-weight="bold" fill="#111">Magician E6</text>
  <text x="736" y="414" text-anchor="middle" font-size="15" fill="#111">MovJ / ServoJ</text>

  <!-- ================= contract notes, one step below body size ================= -->
  <text x="24"  y="462" font-size="13" fill="#111">Inputs: two RGB views + language; no joint state</text>
  <text x="536" y="462" font-size="13" fill="#111">Joint-space output; no host-side IK</text>
</svg>
